# Rendered by scripts/app_platform.py for one app. Placeholders are substituted from
# validated values only (slug, env, port, image). Applied into the namespace
# ops-portal-infrastructure created (quota, limits, network policy, PSA).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: app-${slug}
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/managed-by: ops-portal-apps
    ops-portal.databaes.net/app: ${slug}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
        ops-portal.databaes.net/app: ${slug}
    spec:
      # A pod-level true would override the namespace default; keep it false.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ${image}
          # Imported straight into the node's containerd; there is no registry.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: app-${slug}
  labels:
    app.kubernetes.io/managed-by: ops-portal-apps
    ops-portal.databaes.net/app: ${slug}
spec:
  type: NodePort
  # Local keeps the client address (the Traefik LXC), which the namespace's
  # ingress NetworkPolicy matches on.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: app
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: ${port}
