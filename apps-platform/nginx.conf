server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Platform health endpoint; wins over any file a developer names healthz.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        # SPA deep links fall back to index.html.
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
}
