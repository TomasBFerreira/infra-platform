name: Email notify (Renovate PR)

# Reusable workflow: called from each Renovate-managed repo alongside
# cmdb-notify-renovate.yml. Sends Tomas a personal email via the Brevo
# transactional API when Renovate proposes a new COTS-app version — the
# "email me when there's an update" half of the Updates-tab build-out
# (see /app/issues/ for the design doc, and ops-portal-updates for the
# dashboard half that also ingests this same PR-opened event).
#
# Only fires on PR-opened/reopened — we don't email on merge/close, that's
# what the CMDB entry + dashboard status are for.
#
# Runs on GitHub-hosted ubuntu-latest deliberately (not [self-hosted, prod]
# like cmdb-notify-renovate.yml) — this only needs public internet to reach
# api.brevo.com, not the private CMDB NodePort, and ubuntu-latest sidesteps
# any homelab DNS/AdGuard quirks entirely.

on:
  workflow_call:
    inputs:
      pr_title:
        required: true
        type: string
      pr_url:
        required: true
        type: string
      affected_ci:
        description: CI name (same value passed to cmdb-notify-renovate.yml)
        required: true
        type: string
      repo:
        description: owner/repo, for the email body
        required: true
        type: string
    secrets:
      BREVO_API_KEY:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send update-available email via Brevo
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_URL: ${{ inputs.pr_url }}
          AFFECTED_CI: ${{ inputs.affected_ci }}
          REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail

          subject="[Updates] ${AFFECTED_CI}: ${PR_TITLE}"
          html=$(cat <<EOF
          <p>Renovate found a new version for <b>${AFFECTED_CI}</b> (${REPO}).</p>
          <p><a href="${PR_URL}">${PR_TITLE}</a></p>
          <p>Review in the PR above, or from the ops portal Updates tab once
          <code>ops-portal-updates</code> ships. This is a version-diff
          notice only — not a CVE/vulnerability scan.</p>
          EOF
          )

          payload=$(jq -nc \
            --arg subject "$subject" \
            --arg html "$html" \
            '{
              sender: {name: "Ops Updates", email: "noreply@databaes.net"},
              to: [{email: "tomasbrazaof@gmail.com"}],
              subject: $subject,
              htmlContent: $html
            }')

          response=$(curl -sS --fail-with-body --max-time 15 \
            -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${BREVO_API_KEY}" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -d "${payload}")

          echo "Brevo response: ${response}"
