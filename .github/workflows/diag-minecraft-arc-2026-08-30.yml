name: Diagnose minecraft-prod ARC crash-loop

# One-off. minecraft-prod's first-ever ephemeral runner crash-looped
# (pod deleted+recreated ~7x in 40s), got marked Failed, and the
# AutoscalingRunnerSet is now reporting current=1/pending=1 with no
# actual pod backing it — a wedged scale set, blocking every subsequent
# job from ever getting a runner. This resets it (helm uninstall) and
# then watches for the replacement runner pod to catch its actual
# stdout/stderr (previous attempts only ever caught controller
# meta-events, which don't include the runner's own registration error).
on:
  workflow_dispatch:
    inputs:
      reset_only:
        description: 'Only helm-uninstall the scale set, skip the watch/capture'
        type: boolean
        default: false

jobs:
  diag:
    runs-on: [self-hosted, prod]
    steps:
      - name: Fetch SSH key
        env:
          VAULT_ADDR:  ${{ secrets.VAULT_BOOTSTRAP_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_BOOTSTRAP_ROOT_TOKEN }}
        run: |
          vault kv get -field=private_key secret/ssh_keys/worker_node_worker \
            | awk 'NF > 0' > /tmp/diag_key
          chmod 600 /tmp/diag_key

      - name: Reset the wedged scale set
        run: |
          ssh -i /tmp/diag_key -o StrictHostKeyChecking=no root@192.168.10.21 bash <<'REMOTE'
          echo "=== before ==="
          kubectl get autoscalingrunnersets -n arc-runners | grep minecraft
          echo "=== helm uninstall minecraft-prod ==="
          helm uninstall minecraft-prod -n arc-runners --wait --timeout 60s || echo "(uninstall failed or nothing to uninstall)"
          sleep 5
          echo "=== after ==="
          kubectl get autoscalingrunnersets -n arc-runners | grep minecraft || echo "(gone, as expected)"
          kubectl get pods -n arc-runners | grep minecraft || echo "(no minecraft pods)"
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f /tmp/diag_key
