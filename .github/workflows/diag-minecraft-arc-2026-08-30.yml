name: Diagnose minecraft-prod ARC crash-loop

# One-off, same shape as diag-prod-media-stack.yml. The minecraft-prod
# ARC scale set's first-ever ephemeral runner crash-looped and its GH
# Actions job sat "queued" indefinitely — pulling controller + any
# leftover runner-pod logs to find the actual registration error.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: [self-hosted, prod]
    steps:
      - name: Fetch SSH key
        env:
          VAULT_ADDR:  ${{ secrets.VAULT_BOOTSTRAP_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_BOOTSTRAP_ROOT_TOKEN }}
        run: |
          vault kv get -field=private_key secret/ssh_keys/worker_node_worker \
            | awk 'NF > 0' > /tmp/diag_key
          chmod 600 /tmp/diag_key

      - name: Diagnose
        run: |
          ssh -i /tmp/diag_key -o StrictHostKeyChecking=no root@192.168.10.21 bash <<'REMOTE'
          echo "=== Polling for a live minecraft-prod runner pod (up to 90s) ==="
          POD=""
          for i in $(seq 1 30); do
            POD=$(kubectl get pods -n arc-runners -o name 2>/dev/null | grep minecraft-prod | grep -v listener | head -1)
            [ -n "$POD" ] && { echo "found $POD at iteration $i"; break; }
            sleep 3
          done
          if [ -n "$POD" ]; then
            echo "=== describe $POD ==="
            kubectl describe -n arc-runners "$POD" 2>&1 | tail -60
            echo ""
            echo "=== streaming logs from $POD for up to 60s ==="
            timeout 60 kubectl logs -n arc-runners "$POD" --all-containers -f 2>&1
          else
            echo "(no minecraft-prod runner pod appeared in 90s — nothing was queued/dispatched, or it's even faster than this poll)"
          fi
          echo ""
          echo "=== minecraft-prod pods (final state) ==="
          kubectl get pods -n arc-runners | grep minecraft || echo "(none)"
          echo ""
          echo "=== controller logs, filtered for minecraft ==="
          kubectl logs -n arc-runners deployment/arc-gha-rs-controller --tail=500 2>&1 | grep -i minecraft
          echo ""
          echo "=== minecraft-prod listener logs (last 60) ==="
          kubectl logs -n arc-runners -l actions.github.com/scale-set-name=minecraft-prod,actions.github.com/scale-set-listener=true --tail=60 2>&1 \
            || kubectl logs -n arc-runners minecraft-prod-754b578d-listener --tail=60 2>&1
          echo ""
          echo "=== autoscalingrunnerset describe ==="
          kubectl describe autoscalingrunnerset minecraft-prod -n arc-runners 2>&1 | tail -40
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f /tmp/diag_key
