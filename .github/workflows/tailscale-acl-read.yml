name: Tailscale ACL read (read-only)

# Read-only look at the tailnet policy and device tags, for the Ollama lockdown (L1: restrict who
# can reach tomer:11434). Only GETs: it cannot change the ACL, devices or keys. Output is printed
# to the job log with email addresses masked; the API key is never echoed.
# Needs the TAILSCALE_API_KEY to have ACL read + device read scope (403 = it does not; say so, do
# not widen the key from here). See /app/issues/ollama-lockdown-2026-11-11.md.

on:
  workflow_dispatch:
    inputs:
      ollama_host:
        description: 'Tailscale hostname of the Ollama host (to flag the rules that can reach it)'
        required: false
        default: tomer
      ollama_port:
        description: 'Port to check rules against'
        required: false
        default: '11434'

permissions:
  contents: read

jobs:
  read:
    runs-on: [self-hosted, management]
    env:
      TAILSCALE_API_KEY: ${{ secrets.TAILSCALE_API_KEY }}
      TAILSCALE_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
      OLLAMA_HOST_NAME: ${{ inputs.ollama_host }}
      OLLAMA_PORT: ${{ inputs.ollama_port }}
    steps:
      - name: Fetch ACL and devices (GET only)
        run: |
          set +x
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error

          tailnet = os.environ["TAILSCALE_TAILNET"]
          key = os.environ["TAILSCALE_API_KEY"]
          host = os.environ["OLLAMA_HOST_NAME"].strip()
          port = os.environ["OLLAMA_PORT"].strip()
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,63}", host) or not re.fullmatch(r"[0-9]{1,5}", port):
              sys.exit("bad ollama_host/ollama_port input")
          base = f"https://api.tailscale.com/api/v2/tailnet/{tailnet}"

          def get(path, accept="application/json"):
              req = urllib.request.Request(base + path, method="GET",
                                           headers={"Authorization": f"Bearer {key}", "Accept": accept})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode(), r.headers.get("ETag")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:300], None

          mask = lambda s: re.sub(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+", "<email>", s)

          code, body, etag = get("/acl")
          if code != 200:
              print(f"::error::GET /acl returned {code}. 403 = the API key lacks ACL read scope. Body: {mask(body)}")
              sys.exit(1)
          acl = json.loads(body)
          print(f"ACL fetched (ETag {etag}). Top-level keys: {sorted(acl)}")

          code, body, _ = get("/devices?fields=default")
          if code != 200:
              print(f"::error::GET /devices returned {code}: {mask(body)}")
              sys.exit(1)
          devices = json.loads(body).get("devices", [])
          target = next((d for d in devices if d.get("hostname") == host or d.get("name", "").split(".")[0] == host), None)
          if not target:
              print(f"::warning::no device named {host!r} in the tailnet")
          t_addrs = target.get("addresses", []) if target else []
          t_tags = target.get("tags", []) if target else []
          t_owner = "tagged" if t_tags else "user-owned (" + mask(str(target.get("user", "?"))) + ")" if target else "?"
          print(f"\n== {host}: addresses={t_addrs} tags={t_tags} owner={t_owner}")

          print("\n== tagOwners:")
          for tag, owners in sorted(acl.get("tagOwners", {}).items()):
              print(f"  {tag}: {mask(json.dumps(owners))}")
          print("\n== groups (members masked):")
          for g, members in sorted(acl.get("groups", {}).items()):
              print(f"  {g}: {len(members)} member(s)")

          def covers(dst):
              """Heuristic: does a 'dst:port' entry include host:port? False negatives are possible
              (e.g. nested groups, hosts aliases), so read the rules too."""
              d, _, p = dst.rpartition(":")
              port_ok = p == "*" or any(
                  (lo.isdigit() and hi.isdigit() and int(lo) <= int(port) <= int(hi)) if "-" in x
                  else x == port
                  for x in p.split(",") for lo, _, hi in [x.partition("-")])
              dst_ok = d in ("*", "autogroup:member", "autogroup:tagged", host, *t_addrs, *t_tags) \
                  or (d == "autogroup:member" and not t_tags)
              return dst_ok and port_ok

          print(f"\n== acls ({len(acl.get('acls', []))}); [*] = heuristic says it reaches {host}:{port}")
          for i, r in enumerate(acl.get("acls", [])):
              flag = "*" if any(covers(x) for x in r.get("dst", [])) else " "
              print(f" [{flag}] #{i} action={r.get('action')} src={mask(json.dumps(r.get('src')))} dst={mask(json.dumps(r.get('dst')))}")
          grants = acl.get("grants", [])
          print(f"\n== grants ({len(grants)})")
          for i, g in enumerate(grants):
              print(f"  #{i} src={mask(json.dumps(g.get('src')))} dst={mask(json.dumps(g.get('dst')))} ip={json.dumps(g.get('ip'))} app={'yes' if g.get('app') else 'no'}")
          if "acls" not in acl and not grants:
              print("  (no acls and no grants: Tailscale's default is allow-all)")
          print(f"\nssh rules: {len(acl.get('ssh', []))}   tests: {len(acl.get('tests', []))}   nodeAttrs: {len(acl.get('nodeAttrs', []))}")

          print("\n== tagged devices (hostname, first address, tags)")
          for d in sorted(devices, key=lambda x: x.get("hostname", "")):
              if d.get("tags"):
                  print(f"  {d.get('hostname')}: {(d.get('addresses') or ['?'])[0]} {d.get('tags')}")
          print(f"\nuser-owned devices: {sum(1 for d in devices if not d.get('tags'))} (names not listed)")
          PY
