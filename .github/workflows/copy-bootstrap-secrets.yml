name: Copy bootstrap secrets to a new repo

# Seeds a brand-new repo with the three secrets every deploy workflow needs
# (VAULT_BOOTSTRAP_ADDR, VAULT_BOOTSTRAP_ROOT_TOKEN, GH_PAT) by copying THIS
# repo's values. GitHub never returns a secret's value, so a session cannot
# copy one repo's secrets to another by hand; a workflow can read its own.
#
# This replaces minting a new root token for each new repo (the old runbook
# step): every repo shares the same orphan root token that
# sync-bootstrap-vault-token.yml distributes, so copying keeps it that way.
#
# Guards:
#   - the token is checked against the bootstrap vault first, so a stale value
#     is never propagated;
#   - the target must already exist under TomasBFerreira/ and be PRIVATE
#     (a root token must never land in a public repo's secrets);
#   - the repo name is validated and passed through env vars, never inlined.
#
# Usage:
#   gh workflow run copy-bootstrap-secrets.yml -f repo=ops-portal-llm

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Repo name under TomasBFerreira/ (no owner), e.g. ops-portal-llm
        required: true
        type: string

permissions:
  contents: read

jobs:
  copy:
    runs-on: [self-hosted, management]
    steps:
      - name: Validate the target repo
        env:
          INPUT_REPO: ${{ inputs.repo }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$INPUT_REPO" | grep -Eq '^[A-Za-z0-9._-]{1,100}$'; then
            echo "::error::repo must be a bare repo name (letters, digits, . _ -)"; exit 1
          fi
          case "$INPUT_REPO" in .|..|-*) echo "::error::invalid repo name"; exit 1;; esac
          PRIVATE=$(gh repo view "TomasBFerreira/$INPUT_REPO" --json isPrivate --jq .isPrivate) || {
            echo "::error::cannot view TomasBFerreira/$INPUT_REPO (missing repo, or GH_PAT expired/under-scoped)"; exit 1; }
          if [ "$PRIVATE" != "true" ]; then
            echo "::error::TomasBFerreira/$INPUT_REPO is not private; refusing to copy a root token into it"; exit 1
          fi
          echo "TARGET_REPO=TomasBFerreira/$INPUT_REPO" >> "$GITHUB_ENV"

      - name: Check the bootstrap root token is currently valid
        env:
          VAULT_ADDR_IN: ${{ secrets.VAULT_BOOTSTRAP_ADDR }}
          VAULT_TOKEN_IN: ${{ secrets.VAULT_BOOTSTRAP_ROOT_TOKEN }}
        run: |
          set -euo pipefail
          ADDR="${VAULT_ADDR_IN%/}"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Vault-Token: $VAULT_TOKEN_IN" "$ADDR/v1/auth/token/lookup-self")
          [ "$CODE" = "200" ] || { echo "::error::this repo's VAULT_BOOTSTRAP_ROOT_TOKEN is not valid (HTTP $CODE); run sync-bootstrap-vault-token.yml first"; exit 1; }
          echo "bootstrap root token is valid"

      - name: Copy the secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          V_ADDR: ${{ secrets.VAULT_BOOTSTRAP_ADDR }}
          V_TOKEN: ${{ secrets.VAULT_BOOTSTRAP_ROOT_TOKEN }}
        run: |
          set -euo pipefail
          # Values go in on stdin via env vars so they never appear on a command line or in logs.
          printf '%s' "$V_ADDR"  | gh secret set VAULT_BOOTSTRAP_ADDR       --repo "$TARGET_REPO"
          printf '%s' "$V_TOKEN" | gh secret set VAULT_BOOTSTRAP_ROOT_TOKEN --repo "$TARGET_REPO"
          printf '%s' "$GH_TOKEN" | gh secret set GH_PAT                     --repo "$TARGET_REPO"
          echo "Copied VAULT_BOOTSTRAP_ADDR, VAULT_BOOTSTRAP_ROOT_TOKEN, GH_PAT to $TARGET_REPO"
          gh secret list --repo "$TARGET_REPO"
