name: Copy vault secrets to minecraft-console

# One-off provisioning, same shape as copy-vault-secrets-minecraft.yml.
# Bootstrap vault: worker IP + SSH key. Prod vault: secret/sso's
# bootstrap_token, needed by the provision-sso job to register an
# Authentik Proxy Provider for mc-console.databaes.net (same pattern as
# nextcloud's deploy.yml provision-sso job).
on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: [self-hosted, prod]
    steps:
      - name: Set vault secrets in minecraft-console
        run: |
          apt-get install -y -q python3-nacl
          python3 - <<PYEOF
          import os, base64, json, urllib.request
          from nacl import encoding, public

          gh_token = os.environ["GH_PAT"]
          repo     = "TomasBFerreira/minecraft-console"
          secrets  = {
              "VAULT_BOOTSTRAP_ADDR":       os.environ["VAULT_BOOTSTRAP_ADDR"],
              "VAULT_BOOTSTRAP_ROOT_TOKEN": os.environ["VAULT_BOOTSTRAP_ROOT_TOKEN"],
              "VAULT_PROD_ADDR":            os.environ["VAULT_PROD_ADDR"],
              "VAULT_PROD_TOKEN":           os.environ["VAULT_PROD_TOKEN"],
          }

          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/secrets/public-key",
              headers={"Authorization": f"Bearer {gh_token}", "Accept": "application/vnd.github+json"}
          )
          key_data = json.load(urllib.request.urlopen(req))
          key_id   = key_data["key_id"]
          pub_key  = public.PublicKey(key_data["key"].encode(), encoding.Base64Encoder)
          box      = public.SealedBox(pub_key)

          for name, value in secrets.items():
              encrypted = base64.b64encode(box.encrypt(value.encode())).decode()
              payload = json.dumps({"encrypted_value": encrypted, "key_id": key_id}).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/secrets/{name}",
                  data=payload,
                  method="PUT",
                  headers={
                      "Authorization": f"Bearer {gh_token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json"
                  }
              )
              urllib.request.urlopen(req)
              print(f"Secret {name} updated in {repo}")
          PYEOF
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          VAULT_BOOTSTRAP_ADDR: ${{ secrets.VAULT_BOOTSTRAP_ADDR }}
          VAULT_BOOTSTRAP_ROOT_TOKEN: ${{ secrets.VAULT_BOOTSTRAP_ROOT_TOKEN }}
          VAULT_PROD_ADDR: ${{ secrets.VAULT_PROD_ADDR }}
          VAULT_PROD_TOKEN: ${{ secrets.VAULT_PROD_TOKEN }}
