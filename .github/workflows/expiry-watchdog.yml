name: Expiry watchdog

# Daily sweep for credentials that are about to expire — the "remind me
# before something breaks" ask behind the COTS-update-tracking build-out
# (see /app/issues/ for the design doc). Three sources, in order of how
# trustworthy the signal actually is:
#
#   1. Vault periodic/leased tokens (bootstrap + dev/qa/prod env vaults) —
#      real introspection via `vault token lookup`. This is the class of
#      credential that has actually caused outages (VAULT_DEV_TOKEN,
#      VAULT_PROD_TOKEN silently expiring — see infra-platform CLAUDE.md
#      gotchas and /app/reports/2026-05-30-grafana-recovery.md).
#   2. Tailscale authkeys + the API key itself — real introspection via
#      GET /api/v2/tailnet/{tailnet}/keys?all=true, then GET .../keys/{id} per key (`expires` field).
#   3. Everything else that has no expiry-read API at all (classic GH PAT,
#      Brevo creds, the GLM key) — a CURATED list in expiry-watch.json,
#      hand-maintained, date-math only. This is NOT the same quality of
#      signal as 1/2 and the digest email says so explicitly per entry.
#
# Sends ONE digest email (Brevo, same-repo secrets — no cross-repo
# secrets:inherit problem, see email-notify-renovate.yml's header for why
# that matters) listing anything inside its warning window. Silent (no
# email) when nothing is close to expiring.

on:
  schedule:
    - cron: '11 6 * * *'
  workflow_dispatch:
    inputs:
      force_email:
        description: Send the digest even if nothing is close to expiring (smoke test)
        type: boolean
        default: false

jobs:
  sweep:
    runs-on: [self-hosted, management]
    timeout-minutes: 10
    outputs:
      items_json: ${{ steps.aggregate.outputs.items_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Vault periodic tokens
        id: vault_check
        env:
          VAULT_BOOTSTRAP_ADDR: ${{ secrets.VAULT_BOOTSTRAP_ADDR }}
          VAULT_DEV_TOKEN: ${{ secrets.VAULT_DEV_TOKEN }}
          VAULT_ADDR_DEV: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN_DEV: ${{ secrets.VAULT_TOKEN }}
          VAULT_ADDR_QA: ${{ secrets.VAULT_QA_ADDR }}
          VAULT_TOKEN_QA: ${{ secrets.VAULT_QA_TOKEN }}
          VAULT_ADDR_PROD: ${{ secrets.VAULT_PROD_ADDR }}
          VAULT_TOKEN_PROD: ${{ secrets.VAULT_PROD_TOKEN }}
          VAULT_RENOVATE_TOKEN: ${{ secrets.VAULT_RENOVATE_TOKEN }}
        run: |
          set -euo pipefail
          # Periodic tokens are NOT renewed by use: only an explicit renew-self
          # resets the TTL (verified 2026-11-01 — TTL unchanged after a read).
          # Nothing else renews these CI tokens, so this daily sweep does it:
          # every periodic, renewable token it can reach is renewed here, far
          # inside its period. A token that can't be renewed, or is non-periodic
          # and close to expiry, is reported instead.
          warn_hours=48
          findings="[]"

          fmt_ttl () {  # seconds -> "45min" / "30h"
            if [ "$1" -lt 7200 ]; then echo "$(( $1 / 60 ))min"; else echo "$(( $1 / 3600 ))h"; fi
          }

          add_finding () {  # name severity detail
            findings=$(echo "$findings" | jq -c --arg name "$1" --arg sev "$2" --arg detail "$3" \
              '. + [{name: $name, kind: "vault_token", severity: $sev, detail: $detail}]')
          }

          check_token () {
            local label="$1" addr="$2" token="$3" remint="$4"
            [ -n "$token" ] || { echo "skip ${label}: no token secret set"; return; }
            local out
            if ! out=$(VAULT_ADDR="$addr" VAULT_TOKEN="$token" vault token lookup -format=json 2>&1); then
              # Vault's error carries the URL and HTTP status, never the token.
              local reason
              reason=$(echo "$out" | grep -v '^[[:space:]]*$' | head -n 6 | tr '\n' ' ' | cut -c1-400 || true)
              echo "::warning::Vault token lookup failed for ${label}: ${reason}"
              if echo "$out" | grep -q -i -E 'no route to host|connection refused|i/o timeout|no such host|network is unreachable|context deadline exceeded'; then
                add_finding "$label" warn "could not reach this Vault from the runner — token state unknown (see workflow log)"
              else
                add_finding "$label" critical "lookup failed — token rejected or expired; re-mint with ${remint} (see workflow log)"
              fi
              return
            fi
            local ttl period renewable
            ttl=$(echo "$out" | jq -r '.data.ttl // 0')
            period=$(echo "$out" | jq -r '.data.period // 0')
            renewable=$(echo "$out" | jq -r '.data.renewable // false')
            if [ "$period" != "0" ] && [ "$renewable" = "true" ]; then
              local rout
              if rout=$(VAULT_ADDR="$addr" VAULT_TOKEN="$token" vault token renew -format=json 2>&1); then
                echo "renewed ${label}: ttl was $(fmt_ttl "$ttl"), now $(fmt_ttl "$(echo "$rout" | jq -r '.auth.lease_duration // 0')")"
              else
                echo "::warning::Vault token renew failed for ${label}: $(echo "$rout" | grep -v '^[[:space:]]*$' | head -n 4 | tr '\n' ' ' | cut -c1-300)"
                add_finding "$label" warn "periodic token could not be renewed (policy may lack auth/token/renew-self); $(fmt_ttl "$ttl") left — re-mint with ${remint}"
              fi
            elif [ "$ttl" != "0" ] && [ "$ttl" -lt "$((warn_hours * 3600))" ]; then
              local kind="non-periodic token"
              [ "$period" != "0" ] && kind="periodic token that Vault reports as non-renewable"
              add_finding "$label" warn "${kind}, $(fmt_ttl "$ttl") left and it cannot be renewed — re-mint with ${remint}"
            fi
          }

          check_token "VAULT_DEV_TOKEN (bootstrap-ci)" "$VAULT_BOOTSTRAP_ADDR" "$VAULT_DEV_TOKEN" "reseed-bootstrap-vault-ci-token.yml"
          check_token "VAULT_TOKEN (dev env-ci)" "$VAULT_ADDR_DEV" "$VAULT_TOKEN_DEV" "reseed-env-vault-ci-token.yml -f environment=dev"
          check_token "VAULT_QA_TOKEN (qa env-ci)" "$VAULT_ADDR_QA" "$VAULT_TOKEN_QA" "reseed-env-vault-ci-token.yml -f environment=qa"
          check_token "VAULT_PROD_TOKEN (prod env-ci)" "$VAULT_ADDR_PROD" "$VAULT_TOKEN_PROD" "reseed-env-vault-ci-token.yml -f environment=prod"
          check_token "VAULT_RENOVATE_TOKEN (bootstrap, renovate policy)" "$VAULT_BOOTSTRAP_ADDR" "$VAULT_RENOVATE_TOKEN" "the rotation recipe in docs/renovate.md"

          echo "vault_findings=$(echo "$findings" | jq -c .)" >> "$GITHUB_OUTPUT"

      - name: Check Tailscale key expiry
        id: ts_check
        env:
          TAILSCALE_API_KEY: ${{ secrets.TAILSCALE_API_KEY }}
          TAILSCALE_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
        run: |
          set -euo pipefail
          warn_days=14
          findings="[]"

          api="https://api.tailscale.com/api/v2/tailnet/${TAILSCALE_TAILNET}"
          ts_get () {
            curl -sS --fail-with-body --max-time 15 -H "Authorization: Bearer ${TAILSCALE_API_KEY}" "$1" 2>&1
          }

          # The list endpoint can return bare {id} entries with no `expires`,
          # so read each key individually. all=true includes keys made by
          # other users (e.g. the API key this job authenticates with).
          if list=$(ts_get "${api}/keys?all=true") && jq -e '.keys' >/dev/null 2>&1 <<<"$list"; then
            listed=$(echo "$list" | jq '.keys | length')
            ids=$(echo "$list" | jq -r '[.keys[]?.id | select(. != null)][:100][]')
            now_epoch=$(date -u +%s)
            details="[]"
            unreadable=0
            total=0
            deadline=$((SECONDS + 300))
            for id in $ids; do
              total=$((total + 1))
              # Bound the loop so a slow API can't hit the job timeout and
              # lose the whole sweep; unvisited keys count as unreadable.
              if [ "$SECONDS" -ge "$deadline" ]; then
                unreadable=$((unreadable + 1))
                continue
              fi
              if d=$(ts_get "${api}/keys/${id}") && jq -e . >/dev/null 2>&1 <<<"$d"; then
                details=$(jq -c --argjson d "$d" '. + [$d]' <<<"$details")
              else
                unreadable=$((unreadable + 1))
              fi
            done
            echo "Tailscale keys listed: ${listed}, checked: ${total}, readable: $((total - unreadable)), with expires: $(jq '[.[] | select(.expires != null)] | length' <<<"$details")"
            # Skip revoked/invalid keys and ones already past expiry: they are
            # dead, and flagging them would alert forever.
            findings=$(jq -c --arg now "$now_epoch" --arg warn_days "$warn_days" --arg unreadable "$unreadable" --arg skipped "$((listed > 100 ? listed - 100 : 0))" '
              [.[] | select(.expires != null and (.revoked // false | not) and (.invalid // false | not)) |
                (.expires | fromdateiso8601) as $exp |
                (($exp - ($now | tonumber)) / 86400 | floor) as $days_left |
                select($days_left >= 0 and $days_left < ($warn_days | tonumber)) |
                {name: ("tailscale key: " + (.description // .id)),
                 kind: "tailscale_key",
                 severity: (if $days_left < 3 then "critical" else "warn" end),
                 detail: (($days_left | tostring) + " day(s) left")}
              ] + (if ($unreadable | tonumber) > 0 then
                [{name: "tailscale key details", kind: "tailscale_key", severity: "warn",
                  detail: (($unreadable) + " key(s) could not be read — expiry unknown, see workflow log")}]
                else [] end)
              + (if ($skipped | tonumber) > 0 then
                [{name: "tailscale key list truncated", kind: "tailscale_key", severity: "warn",
                  detail: (($skipped) + " key(s) beyond the first 100 were not checked")}]
                else [] end)' <<<"$details")
          else
            findings='[{"name":"TAILSCALE_API_KEY","kind":"tailscale_key","severity":"critical","detail":"API call itself failed — key may already be dead, see workflow log"}]'
            echo "::warning::Tailscale API call failed: ${list}"
          fi

          echo "ts_findings=$(echo "$findings" | jq -c .)" >> "$GITHUB_OUTPUT"

      - name: Check curated (non-introspectable) credentials
        id: curated_check
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          findings=$(jq -c --arg today "$today" '
            [.credentials[] |
              (.last_rotated | strptime("%Y-%m-%d") | mktime) as $rotated |
              ($today | strptime("%Y-%m-%d") | mktime) as $now |
              (.rotate_every_days * 86400) as $cadence |
              (.warn_days_before * 86400) as $warn |
              (($rotated + $cadence) - $now) as $seconds_left |
              select($seconds_left < $warn) |
              {name: .name, kind: "manually_tracked", severity: (if $seconds_left < 0 then "critical" else "warn" end),
               detail: (($seconds_left / 86400 | floor | tostring) + " day(s) until due — MANUALLY TRACKED, not real introspection: " + .note)}
            ]' expiry-watch.json)
          echo "curated_findings=$(echo "$findings" | jq -c .)" >> "$GITHUB_OUTPUT"

      - name: Aggregate
        id: aggregate
        env:
          VAULT_FINDINGS: ${{ steps.vault_check.outputs.vault_findings }}
          TS_FINDINGS: ${{ steps.ts_check.outputs.ts_findings }}
          CURATED_FINDINGS: ${{ steps.curated_check.outputs.curated_findings }}
        run: |
          set -euo pipefail
          items=$(jq -c -n \
            --argjson a "$VAULT_FINDINGS" \
            --argjson b "$TS_FINDINGS" \
            --argjson c "$CURATED_FINDINGS" \
            '$a + $b + $c')
          echo "Findings: $(echo "$items" | jq 'length')"
          echo "$items" | jq .
          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "items_json<<${delimiter}"
            echo "$items"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

  email-digest:
    needs: sweep
    if: needs.sweep.outputs.items_json != '[]' || inputs.force_email == true
    # Self-hosted, not ubuntu-latest: Brevo's authorised-IP list only allows the
    # homelab egress IP, so a GitHub-hosted runner gets 401 "unrecognised IP".
    runs-on: [self-hosted, management]
    timeout-minutes: 2
    steps:
      - name: Send expiry digest via Brevo
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ITEMS_JSON: ${{ needs.sweep.outputs.items_json }}
        run: |
          set -euo pipefail
          count=$(echo "${ITEMS_JSON}" | jq 'length')
          subject="[Expiry watchdog] ${count} credential(s) need attention"

          rows=$(echo "${ITEMS_JSON}" | jq -r '
            map("<li><b>" + (.severity | ascii_upcase) + "</b> " + (.name | @html) + " — " + (.detail | @html) + "</li>")
            | join("")
          ')
          html="<p>Expiry watchdog found ${count} credential(s) inside their warning window:</p><ul>${rows}</ul><p>Vault-token and Tailscale-key findings are real introspection. Anything labelled MANUALLY TRACKED comes from expiry-watch.json's hand-maintained rotation dates, not a live API — treat it as a reminder to check, not a certainty.</p>"

          payload=$(jq -nc --arg subject "$subject" --arg html "$html" '{
            sender: {name: "Ops Updates", email: "noreply@databaes.net"},
            to: [{email: "tomasbrazaof@gmail.com"}],
            subject: $subject,
            htmlContent: $html
          }')

          curl -sS --fail-with-body --max-time 15 \
            -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${BREVO_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "${payload}"

  updates-ingest:
    # Feeds the ops-portal Updates tab's expiry panel. Best-effort — see
    # renovate.yml's sibling job for why this can't fail the parent workflow.
    needs: sweep
    if: needs.sweep.outputs.items_json != '' && needs.sweep.outputs.items_json != '[]'
    runs-on: [self-hosted, management]
    env:
      ITEMS_JSON: ${{ needs.sweep.outputs.items_json }}
      UPDATES_HOP_HOST: 192.168.50.4
      UPDATES_BASE: http://192.168.20.11:30099
      VAULT_BOOTSTRAP_ADDR: ${{ secrets.VAULT_BOOTSTRAP_ADDR }}
      VAULT_DEV_TOKEN: ${{ secrets.VAULT_DEV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: POST the batch to /svc/updates/expiry-report
        continue-on-error: true
        run: |
          set -euo pipefail
          source scripts/mint-svc-jwt.sh

          # secret/data/ops-portal/dev/svc-jwt/expiry-watchdog is seeded by
          # seed-ops-portal-vault.yml (infra-platform#398) — same
          # per-issuer signing-key convention every real ops-portal-*
          # service uses, not a bespoke path.
          SIGNING_SECRET=$(curl -sf \
            -H "X-Vault-Token: ${VAULT_DEV_TOKEN}" \
            "${VAULT_BOOTSTRAP_ADDR%/}/v1/secret/data/ops-portal/dev/svc-jwt/expiry-watchdog" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['data']['signing_key'])" \
            2>/dev/null) || SIGNING_SECRET=""

          if [ -z "$SIGNING_SECRET" ]; then
            echo "::warning::no expiry-watchdog svc-jwt key in vault yet (run seed-ops-portal-vault.yml -f environment=dev) — skipping ingest"
            exit 0
          fi

          TOKEN=$(mint_svc_jwt "expiry-watchdog" "updates" "$SIGNING_SECRET")
          PAYLOAD=$(jq -nc --argjson findings "$ITEMS_JSON" '{findings: $findings}')
          PAYLOAD_B64=$(printf '%s' "$PAYLOAD" | base64 -w0)

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 root@${UPDATES_HOP_HOST} \
            "echo '$PAYLOAD_B64' | base64 -d | curl -s -o /dev/null -w 'HTTP %{http_code}\n' -X POST '${UPDATES_BASE}/svc/updates/expiry-report' -H 'X-Service-Token: ${TOKEN}' -H 'Content-Type: application/json' --data-binary @-" \
            || echo "ingest call failed (service may not be deployed yet)"
