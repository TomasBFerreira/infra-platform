name: Renovate

# Self-hosted Renovate orchestrator. Runs on the ARC pilot scale set in the
# dev k3s cluster and opens PRs against the repos listed in renovate/config.js.
#
# Auth: a GitHub App named "Renovate" (separate from the ARC app — different
# permission scope). App credentials are seeded into the dev env vault at
# secret/renovate/github-app with fields {app_id, installation_id, private_key}.
# See docs/renovate.md for the one-time setup.
#
# Cadence: twice daily (08:17 and 20:17 UTC). Use workflow_dispatch with
# dry_run=full for a no-op preview run that shows what Renovate would do.

on:
  schedule:
    - cron: '17 8,20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        # Renovate accepts: null (real run) | extract | lookup | full.
        # We pass these strings through as-is — DO NOT add an alias like
        # 'none', because GHA's `A && B || C` ternary coalesces empty
        # strings to C, so any sentinel that maps to '' falls through to
        # the original value and Renovate enters dry-run anyway (caught
        # 2026-05-18 in run 26060708126 — passed RENOVATE_DRY_RUN=none and
        # Renovate treated the non-empty value as dry-run).
        description: Renovate dry-run mode (null = real run)
        type: choice
        options: ['null', extract, lookup, full]
        default: 'null'
      log_level:
        description: Log verbosity
        type: choice
        options: [info, debug]
        default: info

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    # Routes by ARC scale-set NAME, not classic [self-hosted, label] —
    # see manifests/arc/scale-sets.yml and arc-smoketest.yml for the pattern.
    runs-on: arc-pilot-dev
    timeout-minutes: 30
    outputs:
      items_json: ${{ steps.find_prs.outputs.items_json }}
    env:
      # Bootstrap vault (CT 200, 192.168.50.200), authenticated with a
      # scoped token that can only read `secret/data/renovate/*` and
      # `secret/metadata/renovate/*` — see vault policy `renovate` upserted
      # 2026-05-19. Token is `period=768h` (auto-renews on each use, valid
      # as long as Renovate keeps running at least every 32 days).
      VAULT_ADDR: ${{ secrets.VAULT_BOOTSTRAP_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_RENOVATE_TOKEN }}
    steps:
      - name: Checkout orchestrator config
        uses: actions/checkout@v4

      - name: Fetch Renovate GitHub App credentials from vault
        id: app
        run: |
          set -euo pipefail
          app_id=$(vault kv get -field=app_id secret/renovate/github-app)
          private_key=$(vault kv get -field=private_key secret/renovate/github-app)

          # Mask both before exporting. add-mask is applied line-by-line for the
          # private key, so the PEM body is mostly safe even if a step echoes it.
          echo "::add-mask::${app_id}"
          while IFS= read -r line; do echo "::add-mask::${line}"; done <<< "${private_key}"

          echo "app_id=${app_id}" >> "$GITHUB_OUTPUT"
          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "private_key<<${delimiter}"
            printf '%s\n' "${private_key}"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Mint installation token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ steps.app.outputs.app_id }}
          private-key: ${{ steps.app.outputs.private_key }}
          owner: TomasBFerreira

      # renovate + Node 24 are pre-baked into the arc-runner image as of
      # infra-platform#223 (2026-05-19). Drop the setup-node + npm install
      # steps that previously provisioned them per-dispatch (~40s overhead).
      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ steps.token.outputs.token }}
          RENOVATE_CONFIG_FILE: ${{ github.workspace }}/renovate/config.js
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          # Renovate accepts 'null' as the sentinel for "not a dry-run".
          # Scheduled runs (no inputs.dry_run) pass through as empty string;
          # Renovate also treats unset / empty as real run.
          RENOVATE_DRY_RUN: ${{ inputs.dry_run || 'null' }}
        run: renovate

      - name: Find Renovate PRs opened this run
        id: find_prs
        if: inputs.dry_run == '' || inputs.dry_run == 'null'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          # 13h lookback against a 12h (08:17/20:17 UTC) cadence — 1h buffer
          # so a late/rerun doesn't silently drop a PR, at the cost of an
          # occasional duplicate mention across two consecutive digests.
          since=$(date -u -d '13 hours ago' +%Y-%m-%dT%H:%M:%S)

          # repo -> CMDB CI name, kept in sync by hand with renovate/config.js
          # and each repo's renovate-cmdb-notify.yml `affected_ci` input.
          declare -A ci_for=(
            [TomasBFerreira/nextcloud]=nextcloud-prod
            [TomasBFerreira/wikijs]=wikijs-prod
            [TomasBFerreira/media-stack]=media-stack
            [TomasBFerreira/infra-platform]=authentik-prod
          )

          repo_qualifiers=""
          for repo in "${!ci_for[@]}"; do
            repo_qualifiers="${repo_qualifiers} repo:${repo}"
          done

          query="is:pr is:open author:app/renovate-tbf created:>=${since}${repo_qualifiers}"
          echo "Search query: ${query}"

          results=$(gh api search/issues -f q="${query}" -f per_page=50)

          items="[]"
          while IFS= read -r pr; do
            repo=$(echo "$pr" | jq -r '.repository_url' | sed 's#.*/repos/##')
            ci="${ci_for[$repo]:-$repo}"
            title=$(echo "$pr" | jq -r '.title')

            # Critical-CI heuristic for the ops-portal Updates tab / GLM
            # agent's skip-list — see /app/issues/cots-update-tracking-2026-09-11.md.
            # infra-platform is ALWAYS critical here (its only tracked PR is
            # the Authentik version pin). Everything else is critical only
            # if the PR title mentions postgres — a per-package check would
            # be more precise than this per-title-text heuristic, but the
            # search API doesn't hand us Renovate's per-dependency metadata.
            critical="false"
            if [ "$repo" = "TomasBFerreira/infra-platform" ]; then
              critical="true"
            elif echo "$title" | grep -qi "postgres"; then
              critical="true"
            fi

            entry=$(echo "$pr" | jq -c --arg ci "$ci" --arg repo "$repo" --argjson critical "$critical" \
              '{repo: $repo, title: .title, url: .html_url, affected_ci: $ci, critical: $critical}')
            items=$(echo "$items" | jq -c ". + [${entry}]")
          done < <(echo "$results" | jq -c '.items[]')

          echo "Found $(echo "$items" | jq 'length') new Renovate PR(s)."
          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "items_json<<${delimiter}"
            echo "$items"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

  email-digest:
    needs: renovate
    if: needs.renovate.outputs.items_json != '' && needs.renovate.outputs.items_json != '[]'
    uses: ./.github/workflows/email-notify-renovate.yml
    with:
      items_json: ${{ needs.renovate.outputs.items_json }}
    secrets: inherit

  updates-ingest:
    # Feeds the ops-portal Updates tab. Best-effort: ops-portal-updates only
    # exists in dev today (see /app/issues/cots-update-tracking-2026-09-11.md)
    # and this must never fail the Renovate run itself if the service isn't
    # up yet — continue-on-error per item.
    needs: renovate
    if: needs.renovate.outputs.items_json != '' && needs.renovate.outputs.items_json != '[]'
    runs-on: [self-hosted, management]
    env:
      ITEMS_JSON: ${{ needs.renovate.outputs.items_json }}
      UPDATES_HOP_HOST: 192.168.50.4
      UPDATES_BASE: http://192.168.20.11:30099
      VAULT_BOOTSTRAP_ADDR: ${{ secrets.VAULT_BOOTSTRAP_ADDR }}
      VAULT_DEV_TOKEN: ${{ secrets.VAULT_DEV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: POST each item to /svc/updates/renovate-event
        continue-on-error: true
        run: |
          set -euo pipefail
          source scripts/mint-svc-jwt.sh

          # secret/data/ops-portal/dev/svc-jwt/renovate-orchestrator is
          # seeded by seed-ops-portal-vault.yml (infra-platform#398) — same
          # per-issuer signing-key convention every real ops-portal-* service
          # uses, not a bespoke path.
          SIGNING_SECRET=$(curl -sf \
            -H "X-Vault-Token: ${VAULT_DEV_TOKEN}" \
            "${VAULT_BOOTSTRAP_ADDR%/}/v1/secret/data/ops-portal/dev/svc-jwt/renovate-orchestrator" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['data']['signing_key'])" \
            2>/dev/null) || SIGNING_SECRET=""

          if [ -z "$SIGNING_SECRET" ]; then
            echo "::warning::no renovate-orchestrator svc-jwt key in vault yet (run seed-ops-portal-vault.yml -f environment=dev) — skipping ingest"
            exit 0
          fi

          TOKEN=$(mint_svc_jwt "renovate-orchestrator" "updates" "$SIGNING_SECRET")

          echo "$ITEMS_JSON" | jq -c '.[]' | while IFS= read -r item; do
            PAYLOAD=$(echo "$item" | jq -c '{
              ci: .affected_ci, repo: .repo, pr_title: .title, pr_url: .url,
              status: "open", critical: .critical
            }')
            PAYLOAD_B64=$(printf '%s' "$PAYLOAD" | base64 -w0)
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 root@${UPDATES_HOP_HOST} \
              "echo '$PAYLOAD_B64' | base64 -d | curl -s -o /dev/null -w 'HTTP %{http_code} '  -X POST '${UPDATES_BASE}/svc/updates/renovate-event' -H 'X-Service-Token: ${TOKEN}' -H 'Content-Type: application/json' --data-binary @-" \
              || echo "(ingest call failed for $(echo "$item" | jq -r .url) — service may not be deployed yet)"
            echo "ingested: $(echo "$item" | jq -r .url)"
          done
