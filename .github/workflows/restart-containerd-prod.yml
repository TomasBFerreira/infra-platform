name: Restart containerd on prod worker (one-shot)

on:
  workflow_dispatch:
    inputs:
      worker_ip:
        description: 'Worker node IP'
        required: true
        default: '192.168.10.21'

jobs:
  restart-containerd:
    runs-on: [self-hosted, prod]
    env:
      VAULT_ADDR: ${{ secrets.VAULT_BOOTSTRAP_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_BOOTSTRAP_ROOT_TOKEN }}
      WORKER_IP: ${{ inputs.worker_ip }}
    steps:
      - name: Normalise Vault address
        run: |
          ADDR="${VAULT_ADDR}"
          [[ "$ADDR" == http://* || "$ADDR" == https://* ]] || ADDR="http://${ADDR}"
          echo "VAULT_ADDR=${ADDR}" >> $GITHUB_ENV

      - name: Fetch SSH key from Vault
        run: |
          vault kv get -field=private_key secret/ssh_keys/worker_node_worker \
            | awk 'NF > 0' > /tmp/worker_node_key
          chmod 600 /tmp/worker_node_key

      - name: Diagnose and fix NVML mismatch
        run: |
          ssh -i /tmp/worker_node_key -o StrictHostKeyChecking=no root@$WORKER_IP bash <<'EOF'
          set -e
          echo "=== Loaded NVIDIA modules ==="
          lsmod | grep nvidia || echo "no nvidia modules loaded"

          echo "=== NVIDIA driver version ==="
          cat /proc/driver/nvidia/version 2>/dev/null || echo "not found"

          echo "=== Reloading NVIDIA kernel modules ==="
          rmmod nvidia_uvm 2>/dev/null || true
          rmmod nvidia_drm 2>/dev/null || true
          rmmod nvidia_modeset 2>/dev/null || true
          rmmod nvidia 2>/dev/null || true
          modprobe nvidia
          modprobe nvidia_modeset
          modprobe nvidia_drm
          modprobe nvidia_uvm
          echo "NVIDIA modules reloaded"

          echo "=== Restarting k3s (embeds containerd) ==="
          systemctl restart k3s
          echo "k3s restarted"
          EOF

      - name: Wait for node to rejoin and pod to start
        run: |
          sleep 45
          ssh -i /tmp/worker_node_key -o StrictHostKeyChecking=no root@$WORKER_IP \
            "k3s kubectl get pods -n streambox 2>/dev/null || crictl ps 2>/dev/null | grep streambox || echo 'checking...'"

      - name: Cleanup key
        if: always()
        run: rm -f /tmp/worker_node_key
