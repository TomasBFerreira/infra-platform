name: Restart containerd on prod worker (one-shot)

on:
  workflow_dispatch:
    inputs:
      worker_ip:
        description: 'Worker node IP'
        required: true
        default: '192.168.10.21'

jobs:
  restart-containerd:
    runs-on: [self-hosted, prod]
    env:
      VAULT_ADDR: ${{ secrets.VAULT_BOOTSTRAP_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_BOOTSTRAP_ROOT_TOKEN }}
      WORKER_IP: ${{ inputs.worker_ip }}
    steps:
      - name: Normalise Vault address
        run: |
          ADDR="${VAULT_ADDR}"
          [[ "$ADDR" == http://* || "$ADDR" == https://* ]] || ADDR="http://${ADDR}"
          echo "VAULT_ADDR=${ADDR}" >> $GITHUB_ENV

      - name: Fetch SSH key from Vault
        run: |
          vault kv get -field=private_key secret/ssh_keys/worker_node_worker \
            | awk 'NF > 0' > /tmp/worker_node_key
          chmod 600 /tmp/worker_node_key

      - name: Reboot worker node
        run: |
          echo "Rebooting $WORKER_IP to clear NVIDIA driver/library version mismatch..."
          ssh -i /tmp/worker_node_key -o StrictHostKeyChecking=no root@$WORKER_IP \
            "reboot" || true   # SSH exits non-zero as the connection drops on reboot

      - name: Wait for node to come back up
        run: |
          echo "Waiting 90s for node to reboot..."
          sleep 90
          for i in $(seq 1 12); do
            if ssh -i /tmp/worker_node_key -o StrictHostKeyChecking=no -o ConnectTimeout=5 root@$WORKER_IP \
                "echo 'node is up' && systemctl is-active k3s" 2>/dev/null; then
              echo "Node back and k3s is active"
              break
            fi
            echo "Attempt $i — not ready yet, waiting 10s..."
            sleep 10
          done

      - name: Check streambox pod status
        run: |
          ssh -i /tmp/worker_node_key -o StrictHostKeyChecking=no root@$WORKER_IP \
            "k3s kubectl get pods -n streambox 2>/dev/null || echo 'k3s not ready yet'"

      - name: Cleanup key
        if: always()
        run: rm -f /tmp/worker_node_key
