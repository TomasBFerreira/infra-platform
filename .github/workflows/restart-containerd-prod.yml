name: Restart containerd on prod worker (one-shot)

on:
  workflow_dispatch:
    inputs:
      worker_ip:
        description: 'Worker node IP'
        required: true
        default: '192.168.10.21'

jobs:
  restart-containerd:
    runs-on: streambox-prod
    env:
      VAULT_ADDR: ${{ secrets.VAULT_BOOTSTRAP_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_BOOTSTRAP_ROOT_TOKEN }}
      WORKER_IP: ${{ inputs.worker_ip }}
    steps:
      - name: Normalise Vault address
        run: |
          VAULT_ADDR_NORM="${VAULT_ADDR}"
          if [[ "${VAULT_ADDR_NORM}" != http://* && "${VAULT_ADDR_NORM}" != https://* ]]; then
            VAULT_ADDR_NORM="http://${VAULT_ADDR_NORM}"
          fi
          echo "VAULT_ADDR=${VAULT_ADDR_NORM}" >> $GITHUB_ENV

      - name: Fetch SSH key from Vault
        run: |
          vault kv get -field=private_key secret/ssh_keys/worker_node_worker \
            | awk 'NF > 0' > /tmp/worker_node_key
          chmod 600 /tmp/worker_node_key

      - name: Restart containerd
        run: |
          ssh -i /tmp/worker_node_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            root@$WORKER_IP \
            "systemctl restart containerd && echo 'containerd restarted OK'"

      - name: Wait and check pod
        run: |
          sleep 20
          ssh -i /tmp/worker_node_key \
            -o StrictHostKeyChecking=no \
            root@$WORKER_IP \
            "crictl ps 2>/dev/null | grep streambox || echo 'streambox not yet listed (may still be starting)'"

      - name: Cleanup key
        if: always()
        run: rm -f /tmp/worker_node_key
