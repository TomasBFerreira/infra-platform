name: App DNS (Developer area)

# Adds or removes the DNS for one Developer-area app in one env. Dispatched by
# the apps platform when it provisions or tears down an app (and usable by
# hand). Idempotent: a repeat dispatch changes nothing.
#
#   dev / qa : records <slug>-<env>.databaes.net in the generated
#              ansible/adguard/roles/adguard/vars/apps-rewrites.yml (via a PR that
#              is merged straight away, so every change leaves a trail), then
#              re-applies the adguard role on EVERY env's AdGuard (each AdGuard
#              answers for every env's hostnames; see the role). Dev/QA have no
#              Cloudflare CNAME on purpose.
#   prod     : nothing to do here. The prod hostname lives in traefik-gitops
#              config/dynamic/apps.yml and traefik-gitops sync-dns.yml creates
#              (or deletes) the Cloudflare CNAME when that file changes.
#
# Refuses invalid or reserved slugs and hostnames the hand-maintained rewrite
# lists already own (scripts/app_dns.py).
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'App slug (e.g. my-shop)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [dev, qa, prod]
      action:
        description: 'add or remove'
        required: true
        type: choice
        options: [add, remove]
        default: add

concurrency:
  group: app-dns
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  app-dns:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      SLUG: ${{ inputs.slug }}
      TARGET_ENV: ${{ inputs.environment }}
      ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Prod needs no AdGuard entry
        if: env.TARGET_ENV == 'prod'
        run: |
          echo "Prod app hostnames resolve through Cloudflare. The CNAME is created or deleted by"
          echo "traefik-gitops sync-dns.yml when the route appears in or leaves config/dynamic/apps.yml."
          echo "Nothing to do for AdGuard."

      - name: Install PyYAML and run the script's tests
        if: env.TARGET_ENV != 'prod'
        run: |
          pip install --quiet 'PyYAML==6.0.2'
          python3 scripts/test_app_dns.py

      - name: Record the rewrite (PR, merged immediately)
        id: edit
        if: env.TARGET_ENV != 'prod'
        run: |
          # SLUG is validated by the script before it is used anywhere else.
          RESULT=$(python3 scripts/app_dns.py "$ACTION" "$SLUG" "$TARGET_ENV")
          echo "$RESULT"
          if [ "$(echo "$RESULT" | python3 -c 'import sys,json; print(json.load(sys.stdin)["changed"])')" = "True" ]; then
            BRANCH="chore/app-dns-${ACTION}-${SLUG}-${TARGET_ENV}-${GITHUB_RUN_ID}"
            git config user.name  "ops-portal-apps[bot]"
            git config user.email "noreply@databaes.net"
            git checkout -b "$BRANCH"
            git add ansible/adguard/roles/adguard/vars/apps-rewrites.yml
            git commit -m "chore: ${ACTION} app DNS rewrite ${SLUG}-${TARGET_ENV}.databaes.net

          Generated by app-dns.yml run ${GITHUB_RUN_ID}."
            git push origin "$BRANCH"
            gh pr create --base main --head "$BRANCH" \
              --title "chore: ${ACTION} app DNS rewrite ${SLUG}-${TARGET_ENV}" \
              --body "Generated by app-dns.yml (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Only touches the generated apps-rewrites.yml."
            gh pr merge "$BRANCH" --squash --delete-branch
          else
            echo "No change needed (already ${ACTION}ed)."
          fi

      - name: Apply the adguard role on every env's AdGuard
        if: env.TARGET_ENV != 'prod'
        run: |
          # Every AdGuard answers for every env's hostnames (Tailscale split DNS
          # races them), so all three need the new list. Sequential: each run
          # also refreshes Tailscale split DNS, which is serialized anyway.
          for E in dev qa prod; do
            TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run update-adguard-rewrites.yml --ref main -f environment="$E"
            RUN=""
            for _ in $(seq 1 30); do
              sleep 4
              RUN=$(gh run list --workflow update-adguard-rewrites.yml --event workflow_dispatch --limit 5 \
                --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$TS\")] | last | .databaseId // empty")
              [ -n "$RUN" ] && break
            done
            [ -n "$RUN" ] || { echo "::error::could not find the update-adguard-rewrites run for $E"; exit 1; }
            echo "update-adguard-rewrites ($E): run $RUN"
            if ! gh run watch "$RUN" --exit-status; then
              # The role is idempotent; one AdGuard API hiccup (seen once on prod,
              # 2026-11-14, gone on re-run) should not fail the whole app DNS job.
              echo "::warning::update-adguard-rewrites ($E) failed, retrying once"
              TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              gh workflow run update-adguard-rewrites.yml --ref main -f environment="$E"
              RUN=""
              for _ in $(seq 1 30); do
                sleep 4
                RUN=$(gh run list --workflow update-adguard-rewrites.yml --event workflow_dispatch --limit 5 \
                  --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$TS\")] | last | .databaseId // empty")
                [ -n "$RUN" ] && break
              done
              [ -n "$RUN" ] || { echo "::error::could not find the retry run for $E"; exit 1; }
              gh run watch "$RUN" --exit-status
            fi
          done
