name: Seed env vault secret

# Writes a secret directly into a per-env vault (dev/qa/prod), the env-vault
# sibling of seed-bootstrap-vault.yml (which only targets the bootstrap
# vault). Needed because some secrets — like the per-env Tailscale authkey
# used by <env>-network-vm — live in the env vault itself, not bootstrap.
#
# Auth: uses each env's root token (VAULT_DEV_ROOT_TOKEN / VAULT_QA_ROOT_TOKEN
# / VAULT_ROOT_TOKEN for prod), same lookup as reseed-env-vault-ci-token.yml,
# since root tokens don't expire and are guaranteed to have KV write access
# regardless of the current state of the env's CI token policy.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target env vault'
        required: true
        default: 'dev'
        type: choice
        options: [dev, qa, prod]
      secret_path:
        description: 'Vault secret path (e.g. tailscale)'
        required: true
        type: choice
        options:
          - tailscale
      ts_authkey:
        description: '[tailscale] authkey'
        required: false

jobs:
  seed:
    runs-on: [self-hosted, "${{ inputs.environment }}"]
    env:
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Resolve env vault address + root token
        run: |
          case "$ENVIRONMENT" in
            dev)  RAW='${{ secrets.VAULT_ADDR }}';    ROOT='${{ secrets.VAULT_DEV_ROOT_TOKEN }}' ;;
            qa)   RAW='${{ secrets.VAULT_QA_ADDR }}'; ROOT='${{ secrets.VAULT_QA_ROOT_TOKEN }}'  ;;
            prod) RAW='${{ secrets.VAULT_PROD_ADDR }}'; ROOT='${{ secrets.VAULT_ROOT_TOKEN }}'   ;;
          esac
          if [[ "$RAW" != http://* && "$RAW" != https://* ]]; then RAW="http://${RAW}"; fi
          if [ -z "$ROOT" ]; then echo "ERROR: no root token secret for $ENVIRONMENT"; exit 1; fi
          echo "::add-mask::$ROOT"
          echo "VAULT_ADDR=$RAW"   >> "$GITHUB_ENV"
          echo "VAULT_TOKEN=$ROOT" >> "$GITHUB_ENV"

      - name: Write secret to env vault
        run: |
          SECRET="${{ inputs.secret_path }}"
          case "$SECRET" in
            tailscale)
              vault kv put secret/tailscale \
                authkey="${{ inputs.ts_authkey }}"
              ;;
          esac
          echo "Written secret/$SECRET to ${ENVIRONMENT} env vault."
