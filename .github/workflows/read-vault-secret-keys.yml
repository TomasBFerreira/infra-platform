name: Read Vault secret field names (diagnostic)

# Read-only diagnostic for confirming a secret's FIELD NAMES without ever
# printing field VALUES — useful when a workflow assumes a field name (e.g.
# "api_key") that was never verified against the real secret. Never writes,
# never rotates, never logs a value.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which env's vault to read (bootstrap uses the CT 200 vault)
        required: true
        type: choice
        options: [bootstrap, dev, qa, prod]
      path:
        description: 'Secret path under secret/data/ (e.g. AI/GLM/ops-upd)'
        required: true

jobs:
  read:
    runs-on: [self-hosted, management]
    env:
      SECRET_PATH: ${{ inputs.path }}
      TARGET_ENV: ${{ inputs.environment }}
    steps:
      - name: Validate path input
        run: |
          case "$SECRET_PATH" in
            *..*|*'?'*|*'#'*|/*) echo "path must be a plain secret/data/ subpath (no .., ?, #, or leading /)"; exit 1 ;;
          esac

      - name: Resolve vault address + token for the chosen env
        run: |
          # bootstrap uses VAULT_DEV_TOKEN (the least-privilege bootstrap-ci
          # policy already grants secret/data/* read) rather than the root
          # token — this tool only ever needs a KV read. See docs/vaults.md
          # "Vault Authentication".
          case "$TARGET_ENV" in
            bootstrap) ADDR="${{ secrets.VAULT_BOOTSTRAP_ADDR }}"; TOK="${{ secrets.VAULT_DEV_TOKEN }}" ;;
            dev)       ADDR="${{ secrets.VAULT_ADDR }}";           TOK="${{ secrets.VAULT_TOKEN }}" ;;
            qa)        ADDR="${{ secrets.VAULT_QA_ADDR }}";        TOK="${{ secrets.VAULT_QA_TOKEN }}" ;;
            prod)      ADDR="${{ secrets.VAULT_PROD_ADDR }}";      TOK="${{ secrets.VAULT_PROD_TOKEN }}" ;;
          esac
          echo "::add-mask::$TOK"
          echo "VAULT_ADDR=$ADDR" >> "$GITHUB_ENV"
          echo "VAULT_TOKEN=$TOK" >> "$GITHUB_ENV"

      - name: Print field names only
        run: |
          set -o pipefail
          TMPFILE=$(mktemp)
          echo "TMPFILE=$TMPFILE" >> "$GITHUB_ENV"
          HTTP_CODE=$(curl -s -o "$TMPFILE" -w "%{http_code}" -H "X-Vault-Token: $VAULT_TOKEN" \
            "${VAULT_ADDR%/}/v1/secret/data/${SECRET_PATH}")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Vault returned HTTP $HTTP_CODE for secret/data/${SECRET_PATH} — check the path and environment"
            exit 1
          fi
          SECRET_TMPFILE="$TMPFILE" python3 -c '
          import json, os, sys
          with open(os.environ["SECRET_TMPFILE"]) as f:
              d = json.load(f)["data"]["data"]
          path = os.environ["SECRET_PATH"]
          if d is None:
              print(f"secret/data/{path} exists but its current version is soft-deleted (data is null)")
              sys.exit(1)
          print(f"Path secret/data/{path} has fields: {sorted(d.keys())}")
          '

      - name: Clean up temp file
        if: always()
        run: rm -f "$TMPFILE"
