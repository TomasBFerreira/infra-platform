name: Seed wedding-site secrets

# wedding-site's deploy.yml reads two secrets per env from the bootstrap vault
# and fails loudly if either is missing:
#
#   secret/wedding-site/<env>/postgres  password   — generated here, ONCE
#   secret/wedding-site/<env>/mail      api_key    — copied from BREVO_API_KEY
#
# and optionally (the excursion editor's auto-translate; the app runs without it):
#
#   secret/wedding-site/<env>/translate key        — copied from DEEPL_API_KEY
#                                                    (one DeepL Free key serves every env.
#                                                    A hand-saved reference copy also sits in
#                                                    the prod ENV vault at
#                                                    secret/wedding-site/dev/translate; this
#                                                    workflow writes the BOOTSTRAP vault, which
#                                                    is what the app's deploy reads)
#
# The Postgres password is only generated when absent: the StatefulSet's PVC
# keeps the password it was initialised with, so rotating it here would lock
# the app out of its own database. Re-run any time the Brevo key is rotated.

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment to seed
        type: choice
        options: [dev, qa, prod]
        required: true

jobs:
  seed:
    runs-on: [self-hosted, management]
    steps:
      - name: Seed Postgres password (if absent) and Brevo API key
        env:
          VAULT_ADDR:    ${{ secrets.VAULT_BOOTSTRAP_ADDR }}
          VAULT_TOKEN:   ${{ secrets.VAULT_DEV_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          TARGET_ENV:    ${{ inputs.env }}
        run: |
          set -euo pipefail
          test -n "$BREVO_API_KEY" || { echo "::error::BREVO_API_KEY Actions secret is empty"; exit 1; }

          PG_PATH="secret/wedding-site/${TARGET_ENV}/postgres"
          # Only a genuine "no such secret" may trigger generation. Any other
          # read failure (permission denied, vault sealed/unreachable, token
          # expired, field missing) must abort: treating it as "absent" would
          # overwrite a live password and lock the app out of its PVC-held DB.
          rc=0
          out="$(vault kv get -field=password "$PG_PATH" 2>&1 >/dev/null)" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "Postgres password already present at $PG_PATH — leaving it alone."
          elif echo "$out" | grep -q "No value found"; then
            vault kv put "$PG_PATH" password="$(openssl rand -hex 24)" >/dev/null
            echo "Generated Postgres password at $PG_PATH."
          else
            echo "::error::Could not read $PG_PATH (not a plain not-found): $out"
            exit 1
          fi

          vault kv put "secret/wedding-site/${TARGET_ENV}/mail" api_key="$BREVO_API_KEY" >/dev/null
          echo "Wrote Brevo API key to secret/wedding-site/${TARGET_ENV}/mail."

          # Optional: without it the app hides the Translate button instead of failing.
          # Whitespace is stripped: a pasted trailing newline would make DeepL answer 403.
          # An empty secret leaves any value already in Vault untouched (remove it by hand to turn the feature off).
          DEEPL_API_KEY="$(printf '%s' "$DEEPL_API_KEY" | tr -d '[:space:]')"
          if [ -n "$DEEPL_API_KEY" ]; then
            vault kv put "secret/wedding-site/${TARGET_ENV}/translate" key="$DEEPL_API_KEY" >/dev/null
            echo "Wrote DeepL API key to secret/wedding-site/${TARGET_ENV}/translate."
          else
            echo "::warning::DEEPL_API_KEY Actions secret is empty — skipping translate; the excursion editor's Translate button stays off."
          fi

      - name: Confirm field names (no values)
        env:
          VAULT_ADDR:  ${{ secrets.VAULT_BOOTSTRAP_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_DEV_TOKEN }}
          TARGET_ENV:  ${{ inputs.env }}
        run: |
          for leaf in postgres mail translate; do
            # translate is optional; postgres and mail must exist (the read below fails the step if not)
            if [ "$leaf" = translate ]; then
              rc=0; out="$(vault kv get "secret/wedding-site/${TARGET_ENV}/translate" 2>&1 >/dev/null)" || rc=$?
              if [ "$rc" -ne 0 ]; then
                # Only a genuine "no such secret" is fine; permission/sealed/network errors fail the step.
                echo "$out" | grep -q "No value found" || { echo "::error::Could not read translate: $out"; exit 1; }
                echo "secret/wedding-site/${TARGET_ENV}/translate: absent (optional)"; continue
              fi
            fi
            echo "secret/wedding-site/${TARGET_ENV}/${leaf}: $(vault kv get -format=json "secret/wedding-site/${TARGET_ENV}/${leaf}" | python3 -c 'import json,sys; print(sorted(json.load(sys.stdin)["data"]["data"]))')"
          done
