name: Add an ops-portal-llm consumer key (dev)

# Mints an API key for one consumer of the LLM gateway and delivers it without any session or log
# ever seeing it:
#   1. appends {name,key,priority,can_lease,allow_api} to secret/ops-portal-llm/dev/api-keys
#      (field keys_json, bootstrap vault), refusing a duplicate name;
#   2. keeps a copy at secret/ops-portal-llm/dev/consumers/<name> (field key) for rotation;
#   3. optionally writes the key into a Kubernetes Secret on the dev cluster, over SSH stdin.
# The gateway only reads keys_json at deploy time, so afterwards re-run ops-portal-llm's deploy.yml
# (restarts the gateway: queue and lease are in memory, so do it when no lease is held).
#
# Mirrors the gateway's rule that gremlin*, bench*, llm-bench*, planner*, incident-planner* keys
# can never have allow_api (keys.Parse refuses the config at startup, so a bad entry here would
# crash-loop the gateway on its next deploy).

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Consumer name (lowercase letters, digits, hyphens), e.g. ai-dev'
        required: true
        type: string
      priority:
        description: 'Queue priority'
        required: true
        default: normal
        type: choice
        options: [high, normal, low]
      can_lease:
        description: 'May hold the exclusive run lease (Gremlin / benchmarks only)'
        required: false
        default: false
        type: boolean
      allow_api:
        description: 'May fall back to the hosted API (never for gremlin*/bench*/planner* names)'
        required: false
        default: false
        type: boolean
      k8s_namespace:
        description: 'Optional: dev-cluster namespace to deliver the key into (must exist)'
        required: false
        type: string
      k8s_secret:
        description: 'Optional: Secret name, e.g. ai-dev-llm'
        required: false
        type: string
      k8s_key:
        description: 'Optional: key inside the Secret, e.g. api-key'
        required: false
        type: string
      rotate:
        description: 'Replace the key of an EXISTING consumer (keeps its priority/can_lease/allow_api; those inputs are ignored). Without it an existing name is refused.'
        required: false
        default: false
        type: boolean
      restart_gateway:
        description: 'Load the key into the running gateway now: patch ops-portal-llm-secrets and restart the gateway (queue and lease are in memory, so a restart drops them). Skipped with a warning if a lease is held or lease state cannot be read. Without it the key is not live until the next gateway restart.'
        required: false
        default: true
        type: boolean
      worker_ip:
        description: 'Dev worker node IP'
        required: false
        default: '192.168.20.11'
        type: string

# Two simultaneous runs would race on the read-modify-write of keys_json.
concurrency:
  group: add-llm-consumer-key
  cancel-in-progress: false

jobs:
  add:
    # The management runner reaches the dev worker (192.168.20.0/24) only by hopping through
    # benedict, the same way cmdb-record.yml does; hence the ProxyCommand below.
    runs-on: [self-hosted, management]
    steps:
      - name: Validate inputs
        env:
          NAME: ${{ inputs.name }}
          NS: ${{ inputs.k8s_namespace }}
          SECRET: ${{ inputs.k8s_secret }}
          SKEY: ${{ inputs.k8s_key }}
          WORKER_IP: ${{ inputs.worker_ip }}
        run: |
          set -euo pipefail
          printf '%s' "$NAME" | grep -Eq '^[a-z][a-z0-9-]{1,30}$' || { echo "::error::name must match ^[a-z][a-z0-9-]{1,30}$"; exit 1; }
          printf '%s' "$WORKER_IP" | grep -Eq '^192\.168\.20\.[0-9]{1,3}$' || { echo "::error::worker_ip must be a dev-subnet address"; exit 1; }
          if [ -n "$NS$SECRET$SKEY" ]; then
            for v in "$NS" "$SECRET"; do printf '%s' "$v" | grep -Eq '^[a-z0-9]([a-z0-9.-]{0,61}[a-z0-9])?$' || { echo "::error::k8s namespace/secret must be DNS-1123 names (all three k8s_* inputs are required together)"; exit 1; }; done
            printf '%s' "$SKEY" | grep -Eq '^[A-Za-z0-9._-]{1,63}$' || { echo "::error::k8s_key is invalid"; exit 1; }
          fi

      - name: Add the key to the vault (and the cluster Secret if asked)
        env:
          VAULT_ADDR:  ${{ secrets.VAULT_BOOTSTRAP_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_DEV_TOKEN }}
          NAME: ${{ inputs.name }}
          PRIORITY: ${{ inputs.priority }}
          CAN_LEASE: ${{ inputs.can_lease }}
          ALLOW_API: ${{ inputs.allow_api }}
          ROTATE: ${{ inputs.rotate }}
          NS: ${{ inputs.k8s_namespace }}
          SECRET: ${{ inputs.k8s_secret }}
          SKEY: ${{ inputs.k8s_key }}
          RESTART: ${{ inputs.restart_gateway }}
          WORKER_IP: ${{ inputs.worker_ip }}
        run: |
          set -euo pipefail
          umask 077
          WORK=$(mktemp -d); trap 'rm -rf "$WORK"' EXIT
          PATH_KEYS=ops-portal-llm/dev/api-keys

          # Current secret; abort rather than clobber if it holds anything besides keys_json.
          # Only "no such secret" may start from an empty list. Any other failure (network, 5xx,
          # token) must abort: treating it as empty would overwrite every existing consumer key.
          if ! vault kv get -format=json "secret/$PATH_KEYS" > "$WORK/cur.json" 2> "$WORK/err"; then
            if grep -q 'No value found at' "$WORK/err"; then
              echo '{"data":{"data":{}}}' > "$WORK/cur.json"
            else
              echo "::error::could not read secret/$PATH_KEYS: $(head -c 300 "$WORK/err")"; exit 1
            fi
          fi

          python3 - "$WORK" <<'PY'
          import json, os, re, secrets, sys
          work = sys.argv[1]
          cur = json.load(open(f"{work}/cur.json"))["data"]["data"]
          extra = sorted(k for k in cur if k != "keys_json")
          if extra:
              sys.exit(f"::error::{os.environ.get('PATH_KEYS','api-keys')} has unexpected fields {extra}; refusing to overwrite")
          entries = json.loads(cur.get("keys_json") or "[]")
          name = os.environ["NAME"]
          rotate = os.environ["ROTATE"] == "true"
          existing = [e for e in entries if e.get("name") == name]
          key = secrets.token_urlsafe(32)          # 43 chars, gateway minimum is 24
          if rotate:
              if len(existing) != 1:
                  sys.exit(f"::error::rotate needs exactly one existing consumer named {name!r} (existing names: {sorted(e.get('name') for e in entries)})")
              existing[0]["key"] = key             # priority/can_lease/allow_api stay as they are
              print(f"rotating the key of {name!r}; flags unchanged")
          else:
              if existing:
                  sys.exit(f"::error::a key named {name!r} already exists (existing names: {sorted(e.get('name') for e in entries)}); use rotate=true or pick another name")
              allow_api = os.environ["ALLOW_API"] == "true"
              if allow_api and re.match(r"^(gremlin|bench|llm-bench|planner|incident-planner)", name):
                  sys.exit(f"::error::{name!r} may never use the hosted API; set allow_api=false")
              entries.append({"name": name, "key": key, "priority": os.environ["PRIORITY"],
                              "can_lease": os.environ["CAN_LEASE"] == "true", "allow_api": allow_api})
          open(f"{work}/keys_json", "w").write(json.dumps(entries))
          open(f"{work}/key", "w").write(key)
          PY

          vault kv put "secret/$PATH_KEYS" keys_json=@"$WORK/keys_json" >/dev/null
          vault kv put "secret/ops-portal-llm/dev/consumers/$NAME" key=@"$WORK/key" >/dev/null
          echo "Wrote consumer '$NAME' (rotate=$ROTATE) to secret/$PATH_KEYS and secret/ops-portal-llm/dev/consumers/$NAME"

          if [ -n "$NS" ]; then
            vault kv get -field=private_key secret/ssh_keys/worker_node_worker | awk 'NF > 0' > "$WORK/ssh"
            chmod 600 "$WORK/ssh"
            B64=$(base64 -w0 < "$WORK/key")
            # The manifest goes over ssh stdin, so the key never appears on a command line.
            printf 'apiVersion: v1\nkind: Secret\nmetadata:\n  name: %s\n  namespace: %s\ntype: Opaque\ndata:\n  %s: %s\n' "$SECRET" "$NS" "$SKEY" "$B64" \
              | ssh -i "$WORK/ssh" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                  -o ProxyCommand="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p root@192.168.50.4" \
                  root@"$WORKER_IP" 'k3s kubectl apply -f -'
            echo "Delivered to Secret $NS/$SECRET key $SKEY"
          fi

          # The gateway reads API_KEYS_JSON once at start, from its own Secret (written by its deploy.yml
          # from this same vault path). An unchanged-image deploy does not roll the pod, so without this
          # step a new or rotated key answers 401 until someone restarts the gateway by hand (CMDB PRB 102).
          if [ "$RESTART" != "true" ]; then
            echo "::warning::restart_gateway=false: the key is in the vault but NOT live; run ops-portal-llm deploy.yml and restart the gateway when no lease is held."
            exit 0
          fi
          [ -s "$WORK/ssh" ] || { vault kv get -field=private_key secret/ssh_keys/worker_node_worker | awk 'NF > 0' > "$WORK/ssh"; chmod 600 "$WORK/ssh"; }
          wk() { ssh -i "$WORK/ssh" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ProxyCommand="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p root@192.168.50.4" \
                   root@"$WORKER_IP" "$@"; }

          # 1. Lease guard. A restart wipes the in-memory lease, which would kill a running Gremlin/bench
          #    run. Lease state is not exposed without an Authentik session, so read the audit trail: the
          #    newest llm.lease.* event decides (acquire = held unless older than MAX_LEASE_TOTAL, 4h).
          #    Audit lags the NATS publish by about a second; an unreadable trail counts as "held".
          HELD=unknown
          if wk 'k3s kubectl -n ops-portal-audit exec deploy/ops-portal-audit -- wget -qO- "http://127.0.0.1:8093/api/audit?service=llm&limit=200"' > "$WORK/audit.json" 2> "$WORK/err"; then
            HELD=$(python3 - "$WORK/audit.json" <<'PY'
          import json, sys, datetime
          try:
              entries = json.load(open(sys.argv[1]))["entries"]
          except Exception:
              print("unknown"); raise SystemExit
          for e in sorted(entries, key=lambda e: e["timestamp"], reverse=True):
              a = e.get("action", "")
              if not a.startswith("llm.lease."):
                  continue
              if a == "llm.lease.acquire":
                  t = datetime.datetime.fromisoformat(e["timestamp"].replace("Z", "+00:00"))
                  age = datetime.datetime.now(datetime.timezone.utc) - t
                  print("no" if age > datetime.timedelta(hours=4) else "yes")
              else:
                  print("no")
              raise SystemExit
          print("no")
          PY
            )
          else
            echo "audit read failed: $(head -c 200 "$WORK/err")"
          fi

          # 2. Update the gateway's own Secret (stdin, so the keys never hit a command line). Safe even if
          #    the restart is skipped: the next restart then loads the new keys.
          python3 -c 'import base64,json,sys; print(json.dumps({"data":{"API_KEYS_JSON":base64.b64encode(open(sys.argv[1],"rb").read()).decode()}}))' "$WORK/keys_json" \
            | wk 'k3s kubectl -n ops-portal-llm patch secret ops-portal-llm-secrets --type merge --patch-file /dev/stdin'
          echo "Updated Secret ops-portal-llm/ops-portal-llm-secrets API_KEYS_JSON"

          # 3. Restart only if no lease is held.
          if [ "$HELD" = "no" ]; then
            wk 'k3s kubectl -n ops-portal-llm rollout restart deploy/ops-portal-llm && k3s kubectl -n ops-portal-llm rollout status deploy/ops-portal-llm --timeout=180s'
            echo "Gateway restarted; key '$NAME' is live."
          else
            echo "::warning::lease state is '$HELD' (yes = a lease is held, unknown = audit unreadable): gateway NOT restarted. The Secret is updated; key '$NAME' goes live on the next gateway restart: k3s kubectl -n ops-portal-llm rollout restart deploy/ops-portal-llm once the lease is released."
          fi
