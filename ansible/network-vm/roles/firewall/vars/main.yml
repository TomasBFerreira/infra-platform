firewall_allowed_ports:
  - 22
  - 53
  - 80
  - 443
  - 3000
  - 41641   # Tailscale UDP (direct WireGuard connections — falls back to DERP relay if blocked)
  - 51820

# Ollama host (personal Windows PC, tailnet IP) that QA pods reach via a TCP forward on
# this gateway. The sync script only acts on the QA subnet (see ollama-forward-sync.sh);
# dev/prod gateways install the files but stay inert.
ollama_forward_upstream: "100.113.78.67"
ollama_forward_port: 11434
ollama_forward_allowed_subnet: "192.168.30"
