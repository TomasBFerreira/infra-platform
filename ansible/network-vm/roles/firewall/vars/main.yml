firewall_allowed_ports:
  - 22
  - 53
  - 80
  - 443
  - 3000
  - 41641   # Tailscale UDP (direct WireGuard connections — falls back to DERP relay if blocked)
  - 51820

# Ollama host (personal Windows PC, tailnet IP) that QA and dev pods reach via a TCP
# forward on their gateway. The sync script only acts when the gateway's LAN prefix equals
# the allowed subnet (see ollama-forward-sync.sh); prod installs the files but stays inert.
ollama_forward_upstream: "100.113.78.67"
ollama_forward_port: 11434
# Keyed by deploy_env (passed by the network-vm pipeline). Unknown/prod/unset -> empty,
# which the script treats as "not enabled" and removes any managed rules.
# QA is deliberately absent (forward disabled 2026-11: the incident planner goes through the
# ops-portal-llm gateway). Dev stays on because the gateway's own upstream uses it.
ollama_forward_allowed_subnet: "{{ {'dev': '192.168.20'}[deploy_env | default('')] | default('') }}"
# Dev only: narrow the forward from the /24 to the single k3s worker node (pods are SNATed to
# it). Empty = whole allowed subnet. The gateway pod runs on this node.
ollama_forward_allowed_source: "{{ {'dev': '192.168.20.11/32'}[deploy_env | default('')] | default('') }}"
